<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/media-query.css">
</head>

<body>
  <main>
    <section id="login">
      <div id="imagem">

      </div>
      <div id="formulario">
        <h1>Login</h1>
        <p>Seja bem vindo(a) novamente.</p>
        <form action="login.php" method="post" autocomplete="on">
          <div class="campo">
            <i class="material-symbols-outlined">person</i>
            <input type="email" name="login" id="IdLogin" placeholder="Seu e-mail" autocomplete="email" required>
            <label for="IdLogin">Login</label>
          </div>
          <div class="campo">
            <i class="material-symbols-outlined">vpn_key</i>
            <input type="password" name="senha" id="IdSenha" placeholder="Sua senha" autocomplete="current-password"
              required minlength="8">
            <label for="IdSenha">Senha</label>
          </div>
          <div>
            <input type="submit" value="Enviar" id="IdEnviar">

            <a href="#" class="botao">Esqueci a senha <i class="material-symbols-outlined">mail</i></a>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>

</html>
