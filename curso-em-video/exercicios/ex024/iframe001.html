<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Iframes</title>
        <style>

        iframe {
            height: 400px;
            width: 400px;
        }

        </style>
    </head>
    <body>
        <h1>Testando o uso de Iframes</h1>
        <p>
            Acessando o site do
            <iframe src="https://www.cursoemvideo.com" frameborder="0" height="300px" scrolling="no"> <!-- O scrolling não funciona em todos os navegadores  -->
                <a href="https://www.cursoemvideo.com" target="_blank">Curso em vídeo</a>
            </iframe>
            para aprender a programar
        </p>

        <br />
        <p>
            E aqui o site do google
            <iframe src="https://www.gustavoguanabara.github.io" frameborder="0" height="500px" width="500px" >
                    <a href="https://www.gustavoguanabara.github.io" target="_blank" >Gustavo Guanabara</a>
            </iframe>
        </p>
    </body>
</html>
