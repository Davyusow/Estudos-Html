<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Formulário</h1>

    <form action="cadastro.php" method="post">
        <p>
            <label for="IdEstado">Estado: </label>
            <select name="estado" id="IdEstado">
                <optgroup label="Região Sudoeste">
                    <option value="SP">São paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>
                <optgroup label="Região Nordeste">
                    <option value="MA">Maranhão</option>
                    <option value="PE" selected>Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="BH">Bahia</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="IdProfissao">Profissão: </label>
            <input type="text" name="profissao" id="IdProfissao" list="listProf">
            <datalist id="listProf">
                <option value="ADM">Administrador</option>
                <option value="CONT">Contabilidade</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
            </datalist>
        </p>
        <p>
            <label for="IdMensagem">Mensagem: </label>
            <textarea name="msg" id="IdMensagem" rows="10"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>

</html>
