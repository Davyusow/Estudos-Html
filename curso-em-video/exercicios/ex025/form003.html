<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="IdNome" name="nome">Nome: </label>
            <input type="text" name="nome" id="IdNome" required placeholder="Nome completo" autocomplete="name">
        </p>
        <p>
            <label for="IdMedia">Média: </label>
            <input type="number" name="media" id="IdMedia" min="0" max="10" step="0.1" required>
        </p>
        <p>
            <label for="IdData">Data: </label>
            <input type="date" name="data" id="IdData" required>
        </p>
        <p>
            <label for="IdHora">Hora: </label>
            <input type="time" name="hora" id="IdHora">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>

</html>
