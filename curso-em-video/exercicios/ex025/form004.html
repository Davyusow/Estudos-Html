<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=;, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="IdEmail">Email: </label>
                <input type="email" name="email" id="IdEmail" placeholder="e-mail" required autocomplete="email">
            </p>
            <p>
                <label for="IdTelefone">Telefone: </label>
                <!-- Sim tem REGEX em HTML -->
                <input type="tel" name="telefone" id="IdTelefone" placeholder="telefone" required autocomplete="tel" pattern="^[0-9]{4}-[0-9]{4}$">
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>
</body>

</html>
